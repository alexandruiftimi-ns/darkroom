<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 240" role="img" aria-label="Darkroom flow: intake, look and motion, direction, slice, build, check and fix, final. You confirm the look and motion, pick the direction, approve the slice and decide at the end.">
  <style>
    .flow { stroke-dasharray: 6 10; animation: run 1.6s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -32; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .d2 { animation-delay: .6s; } .d3 { animation-delay: 1.2s; } .d4 { animation-delay: 1.8s; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
  </style>
  <rect width="1280" height="240" rx="16" fill="#121110"/>
  <g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
    <g fill="#1b1917" stroke="#2e2a26">
      <rect x="31" y="84" width="150" height="84" rx="10"/>
      <rect x="209" y="84" width="150" height="84" rx="10" stroke="#ff7a3d" stroke-opacity=".55"/>
      <rect x="387" y="84" width="150" height="84" rx="10" stroke="#ff7a3d" stroke-opacity=".55"/>
      <rect x="565" y="84" width="150" height="84" rx="10" stroke="#ff7a3d" stroke-opacity=".55"/>
      <rect x="743" y="84" width="150" height="84" rx="10"/>
      <rect x="921" y="84" width="150" height="84" rx="10"/>
      <rect x="1099" y="84" width="150" height="84" rx="10" stroke="#ff7a3d" stroke-opacity=".55"/>
    </g>
    <path d="M183 126h24M361 126h24M539 126h24M717 126h24M895 126h24M1073 126h24" stroke="#3a332d" stroke-width="2"/>
    <path class="flow" d="M183 126h24M361 126h24M539 126h24M717 126h24M895 126h24M1073 126h24" stroke="#ff7a3d" stroke-width="2" fill="none"/>
    <g fill="#ece6dc" font-size="17" font-weight="600">
      <text x="106" y="121">Intake</text><text x="284" y="121">Look + motion</text><text x="462" y="121">Direction</text><text x="640" y="121">Slice</text>
      <text x="818" y="121">Build</text><text x="996" y="121">Check + fix</text><text x="1174" y="121">Final</text>
    </g>
    <g fill="#a39b8f" font-size="12.5">
      <text x="106" y="145">brief + assets</text><text x="284" y="145">pack or brand · 4 levels</text><text x="462" y="145">two coded heroes</text><text x="640" y="145">hero + key motion</text>
      <text x="818" y="145">the whole page</text><text x="996" y="145">capture · audit</text><text x="1174" y="145">your yes</text>
    </g>
    <g fill="#ff7a3d" font-size="11.5" letter-spacing="2" font-weight="600">
      <text class="pulse" x="284" y="66">YOU CONFIRM</text><text class="pulse d2" x="462" y="66">YOU PICK</text>
      <text class="pulse d3" x="640" y="66">YOU APPROVE</text><text class="pulse d4" x="1174" y="66">YOU DECIDE</text>
    </g>
    <g fill="#6f675d" font-size="12">
      <text x="640" y="206">Claude does everything between your four moments, and you can say "just go" at any time.</text>
    </g>
  </g>
</svg>
