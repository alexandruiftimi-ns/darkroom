<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="The four motion levels, each shown as a small animated browser window: calm, animated, one hero effect, and scroll story.">
  <style>
    text { font-family: Inter, Segoe UI, Helvetica, Arial, sans-serif; }
    .t { fill: #ece6dc; font-size: 19px; font-weight: 600; }
    .k { fill: #ff7a3d; font-size: 11.5px; font-weight: 600; letter-spacing: 2px; }
    .s { fill: #a39b8f; font-size: 13px; }
    .bar { fill: #3a342e; } .ink { fill: #d8d0c4; } .acc { fill: #ff7a3d; }
    /* calm: a cursor drifts to the button, the button answers */
    .cursor { animation: cur 4s ease-in-out infinite; }
    @keyframes cur { 0%, 15% { transform: translate(60px, 40px); } 45%, 75% { transform: translate(0, 0); } 100% { transform: translate(60px, 40px); } }
    .btn { animation: btn 4s ease-in-out infinite; }
    @keyframes btn { 0%, 40% { fill: #2e2a26; } 50%, 72% { fill: #ff7a3d; } 85%, 100% { fill: #2e2a26; } }
    /* animated: groups rise and fade in, one after another */
    .rv { animation: rv 4.8s cubic-bezier(.22,1,.36,1) infinite both; }
    .r2 { animation-delay: .35s; } .r3 { animation-delay: .7s; } .r4 { animation-delay: 1.05s; }
    @keyframes rv { 0% { opacity: 0; transform: translateY(14px); } 18%, 82% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(0); } }
    /* hero effect: an object turns */
    .turn { animation: turn 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes turn { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.18); } }
    .shine { animation: shine 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes shine { 0%, 100% { transform: translateX(-14px); opacity: .9; } 50% { transform: translateX(14px); opacity: .2; } }
    /* story: chapters crossfade on a pinned stage while progress fills */
    .c1 { animation: c1 6s linear infinite; } .c2 { animation: c2 6s linear infinite; } .c3 { animation: c3 6s linear infinite; }
    @keyframes c1 { 0%, 28% { opacity: 1; } 34%, 94% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes c2 { 0%, 28% { opacity: 0; } 34%, 61% { opacity: 1; } 67%, 100% { opacity: 0; } }
    @keyframes c3 { 0%, 61% { opacity: 0; } 67%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .prog { animation: prog 6s linear infinite; transform-box: fill-box; transform-origin: left; }
    @keyframes prog { from { transform: scaleX(.02); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .c2, .c3 { opacity: 0; } }
  </style>
  <rect width="1280" height="420" rx="16" fill="#121110"/>

  <!-- card frames -->
  <g fill="#1b1917" stroke="#2e2a26">
    <rect x="40" y="28" width="282" height="364" rx="12"/><rect x="340" y="28" width="282" height="364" rx="12"/>
    <rect x="640" y="28" width="282" height="364" rx="12"/><rect x="940" y="28" width="300" height="364" rx="12"/>
  </g>
  <!-- browser windows -->
  <g fill="#0f0e0d" stroke="#2e2a26">
    <rect x="58" y="64" width="246" height="190" rx="8"/><rect x="358" y="64" width="246" height="190" rx="8"/>
    <rect x="658" y="64" width="246" height="190" rx="8"/><rect x="958" y="64" width="264" height="190" rx="8"/>
  </g>
  <g fill="#3a342e">
    <circle cx="70" cy="76" r="3"/><circle cx="80" cy="76" r="3"/><circle cx="90" cy="76" r="3"/>
    <circle cx="370" cy="76" r="3"/><circle cx="380" cy="76" r="3"/><circle cx="390" cy="76" r="3"/>
    <circle cx="670" cy="76" r="3"/><circle cx="680" cy="76" r="3"/><circle cx="690" cy="76" r="3"/>
    <circle cx="970" cy="76" r="3"/><circle cx="980" cy="76" r="3"/><circle cx="990" cy="76" r="3"/>
  </g>
  <g class="k"><text x="58" y="50">01 · CALM</text><text x="358" y="50">02 · ANIMATED</text><text x="658" y="50">03 · ONE HERO EFFECT</text><text x="958" y="50">04 · SCROLL STORY</text></g>

  <!-- 01 calm -->
  <rect class="ink" x="78" y="102" width="150" height="14" rx="3"/>
  <rect class="bar" x="78" y="124" width="190" height="7" rx="3"/><rect class="bar" x="78" y="137" width="160" height="7" rx="3"/>
  <rect x="78" y="156" width="206" height="62" rx="4" fill="#25211d"/>
  <rect class="btn" x="78" y="228" width="72" height="16" rx="8" fill="#2e2a26"/>
  <g class="cursor"><path d="M150 236l0 16 4-4 3 7 3-1-3-7 6 0z" fill="#ece6dc" stroke="#121110" stroke-width="1"/></g>

  <!-- 02 animated -->
  <rect class="ink rv" x="378" y="100" width="160" height="16" rx="3"/>
  <g class="rv r2"><rect class="bar" x="378" y="124" width="200" height="7" rx="3"/><rect class="bar" x="378" y="137" width="170" height="7" rx="3"/></g>
  <rect class="rv r3" x="378" y="156" width="206" height="54" rx="4" fill="#3a2a20"/>
  <g class="rv r4"><rect x="378" y="218" width="64" height="26" rx="4" fill="#25211d"/><rect x="449" y="218" width="64" height="26" rx="4" fill="#25211d"/><rect x="520" y="218" width="64" height="26" rx="4" fill="#25211d"/></g>

  <!-- 03 hero effect -->
  <rect x="659" y="85" width="244" height="120" fill="#17130f"/>
  <g class="turn"><rect x="751" y="104" width="60" height="82" rx="14" fill="#c9b8a3"/></g>
  <rect class="shine" x="772" y="112" width="8" height="66" rx="4" fill="#fff6ea"/>
  <rect class="bar" x="678" y="216" width="150" height="7" rx="3"/><rect class="bar" x="678" y="229" width="110" height="7" rx="3"/>

  <!-- 04 story -->
  <rect class="c1" x="959" y="85" width="262" height="150" fill="#2a1d14"/>
  <rect class="c2" x="959" y="85" width="262" height="150" fill="#14222a"/>
  <rect class="c3" x="959" y="85" width="262" height="150" fill="#232a14"/>
  <g class="c1"><circle cx="1090" cy="150" r="30" fill="#ff7a3d" opacity=".8"/><text x="978" y="222" fill="#ece6dc" font-size="12">01  The farm</text></g>
  <g class="c2"><rect x="1050" y="122" width="80" height="56" rx="6" fill="#7fb1c9" opacity=".8"/><text x="978" y="222" fill="#ece6dc" font-size="12">02  The roast</text></g>
  <g class="c3"><path d="M1060 178h60l-8-50h-44z" fill="#c9d18a" opacity=".8"/><text x="978" y="222" fill="#ece6dc" font-size="12">03  The cup</text></g>
  <rect x="959" y="241" width="262" height="4" fill="#2e2a26"/>
  <rect class="prog acc" x="959" y="241" width="262" height="4"/>

  <!-- captions -->
  <g class="t"><text x="58" y="290">Calm</text><text x="358" y="290">Animated</text><text x="658" y="290">One hero effect</text><text x="958" y="290">Scroll story</text></g>
  <g class="s">
    <text x="58" y="314">A still, composed page.</text><text x="58" y="332">Hover and focus only.</text><text x="58" y="364" fill="#ff7a3d">You provide: nothing extra</text>
    <text x="358" y="314">Headings rise, text fades,</text><text x="358" y="332">pictures open as you scroll.</text><text x="358" y="364" fill="#ff7a3d">You provide: nothing extra</text>
    <text x="658" y="314">One memorable moment,</text><text x="658" y="332">then a normal page.</text><text x="658" y="364" fill="#ff7a3d">You provide: one clip or image</text>
    <text x="958" y="314">Chapters on a pinned stage;</text><text x="958" y="332">scroll back to replay them.</text><text x="958" y="364" fill="#ff7a3d">You provide: words + media per chapter</text>
  </g>
</svg>
