<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img" aria-label="Three reference looks drawn as abstract page miniatures: Apple-like, light and centred with one product; Rolex-like, dark with a single lit object; Cartier-like, white with a serif headline and a product grid. Language, not identity.">
  <style>
    text { font-family: Inter, Segoe UI, Helvetica, Arial, sans-serif; }
    .k { fill: #ff7a3d; font-size: 11.5px; font-weight: 600; letter-spacing: 2px; }
    .t { fill: #ece6dc; font-size: 18px; font-weight: 600; }
    .s { fill: #a39b8f; font-size: 13px; }
    .in { animation: in 1.2s cubic-bezier(.22,1,.36,1) both; } .i2 { animation-delay: .25s; } .i3 { animation-delay: .5s; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .glow { animation: glow 4s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="alu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9e9ee"/><stop offset=".5" stop-color="#b9bac2"/><stop offset="1" stop-color="#8d8e96"/></linearGradient>
    <radialGradient id="lit" cx=".5" cy=".45" r=".5"><stop offset="0" stop-color="#f3dcb2"/><stop offset=".55" stop-color="#9c7a45"/><stop offset="1" stop-color="#2a2016"/></radialGradient>
    <radialGradient id="pool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5a4a33" stop-opacity=".7"/><stop offset="1" stop-color="#0c0d0c" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="440" rx="16" fill="#121110"/>
  <g class="k"><text x="40" y="44">LOOK · LIKE APPLE</text><text x="447" y="44">LOOK · LIKE ROLEX</text><text x="854" y="44">LOOK · LIKE CARTIER</text></g>

  <!-- Apple-like -->
  <g class="in">
    <rect x="40" y="60" width="386" height="250" rx="10" fill="#f5f5f7"/>
    <rect x="40" y="60" width="386" height="18" rx="9" fill="#e8e8ed"/>
    <rect x="148" y="98" width="170" height="18" rx="4" fill="#1d1d1f"/>
    <rect x="173" y="124" width="120" height="7" rx="3" fill="#86868b"/>
    <rect x="178" y="140" width="48" height="14" rx="7" fill="#1d1d1f"/><rect x="236" y="140" width="52" height="14" rx="7" fill="none" stroke="#1d1d1f"/>
    <rect x="173" y="170" width="120" height="120" rx="22" fill="url(#alu)"/>
    <rect x="183" y="180" width="100" height="100" rx="16" fill="#1d1d1f" opacity=".9"/>
  </g>
  <!-- Rolex-like -->
  <g class="in i2">
    <rect x="447" y="60" width="386" height="250" rx="10" fill="#0c0d0c"/>
    <ellipse cx="640" cy="200" rx="150" ry="90" fill="url(#pool)"/>
    <circle class="glow" cx="640" cy="186" r="54" fill="url(#lit)"/>
    <circle cx="640" cy="186" r="38" fill="none" stroke="#f3dcb2" stroke-opacity=".5"/>
    <rect x="580" y="262" width="120" height="7" rx="3" fill="#d9cdb8" opacity=".8"/>
    <rect x="605" y="276" width="70" height="5" rx="2.5" fill="#6d6458"/>
    <rect x="610" y="86" width="60" height="5" rx="2.5" fill="#6d6458"/>
  </g>
  <!-- Cartier-like -->
  <g class="in i3">
    <rect x="854" y="60" width="386" height="250" rx="10" fill="#ffffff"/>
    <rect x="874" y="78" width="346" height="1" fill="#e4e0da"/>
    <text x="1047" y="122" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#141414" letter-spacing="1">Maison Aurel</text>
    <rect x="1007" y="134" width="80" height="5" rx="2.5" fill="#8a8580"/>
    <g fill="#f3f0ec"><rect x="874" y="156" width="106" height="120" rx="2"/><rect x="994" y="156" width="106" height="120" rx="2"/><rect x="1114" y="156" width="106" height="120" rx="2"/></g>
    <circle cx="927" cy="208" r="22" fill="none" stroke="#5b2a4a" stroke-width="5"/>
    <path d="M1027 230q20-60 40 0" fill="none" stroke="#b49a6a" stroke-width="5"/>
    <rect x="1152" y="196" width="30" height="30" rx="15" fill="#5b2a4a"/>
    <g fill="#8a8580"><rect x="874" y="284" width="60" height="4" rx="2"/><rect x="994" y="284" width="60" height="4" rx="2"/><rect x="1114" y="284" width="60" height="4" rx="2"/></g>
  </g>

  <g class="t"><text x="40" y="344">Light, centred, one product</text><text x="447" y="344">Dark, slow, one lit object</text><text x="854" y="344">White, serif, editorial grid</text></g>
  <g class="s">
    <text x="40" y="368">Huge calm headline, seamless ground,</text><text x="40" y="386">2–6 word claims, pill buttons.</text>
    <text x="447" y="368">Macro detail, ceremony, warm metal accent,</text><text x="447" y="386">long crossfades. Never green with gold.</text>
    <text x="854" y="368">Air, hairlines, small tracked labels,</text><text x="854" y="386">one deep accent. Never red with gold.</text>
  </g>
  <text x="640" y="422" text-anchor="middle" fill="#6f675d" font-size="12.5">Language, not identity: your name, your photos, your words, licensable fonts, your colours. Abstract illustrations; not affiliated with any brand.</text>
</svg>
