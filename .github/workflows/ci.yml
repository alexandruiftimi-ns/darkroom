name: ci
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: github.event_name == 'release'
        run: npm run pack
      - if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/darkroom-skill.zip
