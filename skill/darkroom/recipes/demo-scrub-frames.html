<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrub frames demo</title>
<style>
  body { margin: 0; background: #0b0e14; color: #eef2f8; font: 18px/1.5 system-ui, sans-serif; }
  .intro, .outro { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
  h1 { font-size: clamp(36px, 6vw, 80px); font-weight: 300; margin: 0; }
  #story { height: 500vh; position: relative; }
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; background: #0b0e14; }
  .stage img, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .stage canvas { opacity: 0; transition: opacity .2s; } .stage canvas.on { opacity: 1; }
  .caption { position: absolute; left: 6vw; bottom: 8vh; max-width: 28ch; text-shadow: 0 1px 12px #000; background: linear-gradient(90deg, rgba(0,0,0,.55), transparent); padding: 16px 24px 16px 0; }
  .a11y-skip { position: absolute; left: -999px; }
</style>
</head>
<body>
<main>
  <section class="intro"><h1>Frames follow the scroll</h1></section>
  <section id="story" aria-label="Sequence">
    <div class="stage">
      <img src="demo-frames/poster.webp" alt="Test pattern with a moving gradient">
      <canvas id="c" aria-hidden="true"></canvas>
      <p class="caption">Poster first. Frames decode only near the target.</p>
    </div>
  </section>
  <section class="outro"><h2>End of the scene</h2></section>
</main>
<script type="module">
  import { createFrameScrubber } from './scrub-frames.js';
  const canvas = document.getElementById('c');
  window.__scrub = await createFrameScrubber({ canvas, scene: document.getElementById('story'), manifestUrl: 'demo-frames/manifest.json', onFrame: (i, n) => { document.documentElement.dataset.frame = i + '/' + n; canvas.classList.add('on'); } });
</script>
</body>
</html>
