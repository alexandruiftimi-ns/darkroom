<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media recipes demo</title>
<link rel="stylesheet" href="scene-switcher.css">
<style>
html,body{background:#0b0b0d}
body{margin:0;color:#f2efe8;font:18px/1.55 system-ui,sans-serif}
section{padding:8vh clamp(20px,6vw,64px)}
h1,h2{margin:0 0 16px;font-weight:600;letter-spacing:-.02em}
.turn{max-width:640px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#222}
.turn video{width:100%;height:100%;object-fit:cover;display:block}
.ss{min-height:70vh;display:grid;align-content:end;gap:16px;padding:8vh clamp(20px,6vw,64px)}
.shader{position:relative;min-height:60vh;display:grid;place-items:center;background:#0b0b0d;isolation:isolate}
.shader canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.model{position:relative;max-width:640px;aspect-ratio:4/3;background:#16171a;border-radius:12px;overflow:hidden}
.model>*{position:absolute;inset:0;width:100%;height:100%}
.model-poster{display:grid;place-items:center;color:#999}
.model canvas{opacity:0}.model[data-model-state="ready"] canvas{opacity:1}
</style></head><body>
<main>
<section><h2>Turn it with the mouse</h2><div class="turn" id="turn" data-cursor-scrub><video muted playsinline preload="auto" src="demo-clip.mp4" aria-label="Test pattern, scrubbed by the pointer"></video></div></section>
<section class="ss" id="ss" data-scene-switcher data-tone="dark">
  <div class="ss-media">
    <div class="ss-scene" data-tone="dark"><video muted playsinline loop preload="none" data-src="demo-clip.mp4" aria-hidden="true"></video></div>
    <div class="ss-scene" data-tone="light"><video muted playsinline loop preload="none" data-src="demo-clip.mp4" aria-hidden="true"></video></div>
  </div>
  <h1>Pick the hour</h1>
  <div class="ss-tabs" role="group" aria-label="Time of day"><button type="button" aria-pressed="true">Dawn</button><button type="button" aria-pressed="false">Noon</button></div>
</section>
<section class="shader" id="shader" data-shader="flow" data-shader-colours="#0b0b0d,#33307a,#e2a35b"><canvas data-shader-canvas aria-hidden="true"></canvas><h2>A living backdrop</h2></section>
<section><div class="model" id="model" data-model-hero data-model="missing.glb" data-three="./no-three-here.js" data-gltf-loader="./no-loader-here.js">
  <div class="model-poster" role="img" aria-label="Poster of the product">poster</div><canvas aria-hidden="true"></canvas></div></section>
</main>
<script type="module">
import { cursorScrubVideo } from './cursor-scrub-video.js'; import { sceneSwitcher } from './scene-switcher.js'; import { shaderBackdrop } from './shader-backdrop.js'; import { modelHero } from './model-hero.js';
cursorScrubVideo(); sceneSwitcher(); shaderBackdrop(); modelHero(); window.__ready = true;
</script>
</body></html>
