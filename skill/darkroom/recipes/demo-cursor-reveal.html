<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursor reveal demo</title>
<style>
  body { margin: 0; background: #0f0f10; color: #f2efe8; font: 18px/1.5 system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; }
  .reveal { margin: 0; width: min(80vw, 900px); aspect-ratio: 16 / 9; overflow: hidden; border-radius: 6px; cursor: crosshair; }
  .reveal img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .reveal img:first-child { filter: grayscale(1) brightness(.6); } /* base: muted; the colour version shows through */
  p { text-align: center; }
</style>
</head>
<body>
<main>
  <figure class="reveal" id="r">
    <img src="demo-frames/poster.webp" alt="Test pattern, first frame">
    <img data-reveal-top src="demo-frames/seq_0024.webp" alt="" aria-hidden="true">
  </figure>
  <p>Move the pointer over the image (tap on a phone).</p>
</main>
<script type="module">
  import { cursorReveal } from './cursor-reveal.js';
  window.__reveal = cursorReveal(document.getElementById('r'), { radius: 140 });
</script>
</body>
</html>
