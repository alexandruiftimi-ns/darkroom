<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scrub video demo</title>
<style>
body{margin:0;background:#0b0e14;color:#eef2f8;font:18px/1.5 system-ui,sans-serif}
.intro,.outro{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
h1{font-size:clamp(32px,5vw,64px);font-weight:300;margin:0}
#story{height:400vh;position:relative}
.stage{position:sticky;top:0;height:100vh;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style></head><body><main>
<section class="intro"><h1>Video follows the scroll</h1></section>
<section id="story" aria-label="Clip"><div class="stage"><video id="v" src="demo-clip.mp4" muted playsinline preload="auto" aria-label="Test pattern clip"></video></div></section>
<section class="outro"><h2>End</h2></section></main>
<script type="module">
import { createVideoScrubber } from './scrub-video.js';
window.__s = createVideoScrubber({ video: document.getElementById('v'), scene: document.getElementById('story') });
</script></body></html>
