<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap">
      <a href="{{ "/" | relURL }}"><strong>{{ site.Title }}</strong></a>
    </div>
  </header>
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <div class="wrap"><small>&copy; {{ now.Year }} {{ site.Title }}</small></div>
  </footer>
</body>
</html>
