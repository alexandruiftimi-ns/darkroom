<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darkroom showcase</title>
<style>
  :root { --ground:#121110; --surface:#1b1917; --ink:#ece6dc; --ink-2:#a39b8f; --line:#2e2a26; --accent:#ff7a3d; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--ground); color: var(--ink); font: 16px/1.5 Inter, "Segoe UI", system-ui, sans-serif; }
  header, footer { max-width: 1200px; margin: 0 auto; padding: 56px 24px; }
  header h1 { font: 300 clamp(40px, 6vw, 80px)/1 Georgia, serif; }
  header h1 i { color: var(--accent); }
  header p { color: var(--ink-2); margin-top: 16px; max-width: 52ch; }
  .ad { position: relative; overflow: hidden; border-top: 1px solid var(--line); padding: 96px 24px; background: radial-gradient(60% 70% at 70% 45%, var(--glow, #ff7a3d33), transparent 70%); }
  .ad-inner { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: minmax(240px, 4fr) 8fr; gap: 56px; align-items: center; }
  .copy .tag { color: var(--accent); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }
  .copy h2 { font: 300 clamp(32px, 4vw, 52px)/1.05 Georgia, serif; margin: 12px 0 16px; }
  .copy p { color: var(--ink-2); max-width: 36ch; }
  .copy a { display: inline-block; margin-top: 24px; color: var(--ink); border-bottom: 1px solid var(--accent); text-decoration: none; padding-bottom: 2px; }
  .copy small { display: block; margin-top: 20px; color: #6f685f; font-size: 12px; }
  /* devices: inner screens have a fixed pixel size and are scaled with transform */
  .stage { position: relative; height: 560px; }
  .laptop { position: absolute; left: 0; top: 0; width: 720px; transform-origin: top left; transform: scale(var(--s, 1)); }
  .lid { background: #0a0a0a; border: 2px solid #3a3733; border-radius: 18px 18px 6px 6px; padding: 14px 14px 18px; box-shadow: 0 30px 80px #000a; }
  .screen { width: 692px; height: 432px; overflow: hidden; background: #000; border-radius: 4px; position: relative; }
  .screen iframe { width: 1440px; height: 900px; border: 0; transform: scale(.4806); transform-origin: top left; }
  .base { height: 14px; margin: 0 -40px; background: linear-gradient(#4a4640, #26231f); border-radius: 0 0 24px 24px; box-shadow: 0 18px 30px #0008; }
  .phone { position: absolute; left: 600px; top: 150px; width: 190px; background: #0a0a0a; border: 2px solid #3a3733; border-radius: 30px; padding: 8px; box-shadow: 0 30px 70px #000c; transform-origin: top left; transform: scale(var(--s, 1)); }
  .phone .screen { width: 170px; height: 368px; border-radius: 22px; }
  .phone iframe { width: 390px; height: 844px; transform: scale(.4359); }
  .ad.flip .ad-inner { direction: rtl; } .ad.flip .ad-inner > * { direction: ltr; }
  .ad.flip .phone { left: auto; right: auto; left: 600px; }
  footer { color: #6f685f; font-size: 13px; border-top: 1px solid var(--line); }
  @media (max-width: 960px) { .ad-inner { grid-template-columns: 1fr; gap: 32px; } .stage { height: calc(560px * var(--s, .6)); } .ad.flip .ad-inner { direction: ltr; } }
</style>
</head>
<body>
<header>
  <h1>Made with <i>Darkroom</i></h1>
  <p>Four single-page concepts, each a live iframe on its own local server. Edit the list at the bottom of this file to point at any site.</p>
</header>
<main id="ads"></main>
<footer>All pages shown are fictional or unofficial concepts and are not affiliated with any brand named. Mockup frames are CSS only.</footer>
<script>
  // One entry per ad. url = where the page is served; mobile = optional different url for the phone.
  const SITES = [
    { name: "Halden Kiln", tag: "Ceramics · scroll-scrubbed heat", glow: "#ff7a3d33",
      line: "Clay, taken to 1,280°.", text: "A vessel is fired from cold clay to ember as you scroll.", url: "http://127.0.0.1:8765/index.html",
      note: "Fictional studio." },
    { name: "Forno Cinco", tag: "Bakery · the oven clock", glow: "#d9843a33",
      line: "Lit at five. Sold out by noon.", text: "Scroll advances the morning from 05:00 to 12:00; the menu is the timetable.", url: "http://127.0.0.1:8766/index.html",
      note: "Fictional business." },
    { name: "Porsche 911 Turbo S", tag: "Automotive · frame-sequence hero", glow: "#a6162433", flip: true,
      line: "A concept, frame by frame.", text: "A supplied film becomes a scroll-controlled sequence, with a configurator.", url: "http://127.0.0.1:8767/",
      note: "Unofficial concept, not affiliated with Porsche." },
    { name: "NorthShutter AI Reality", tag: "Hardware · cinematic scroll", glow: "#7fa8d833", flip: true,
      line: "The world inside the visor.", text: "Eight scroll beats take the viewer through the glass.", url: "http://127.0.0.1:8768/",
      note: "Unofficial fictional concept." },
  ];
  const el = document.getElementById("ads");
  SITES.forEach((s, i) => {
    const sec = document.createElement("section");
    sec.className = "ad" + (s.flip ? " flip" : "");
    sec.style.setProperty("--glow", s.glow);
    sec.innerHTML = `
      <div class="ad-inner">
        <div class="copy"><span class="tag">${s.tag}</span><h2>${s.line}</h2><p>${s.text}</p>
          <a href="${s.url}" target="_blank" rel="noopener">Open ${s.name} →</a><small>${s.note}</small></div>
        <div class="stage">
          <div class="laptop"><div class="lid"><div class="screen"><iframe src="${s.url}" title="${s.name} desktop" loading="lazy"></iframe></div></div><div class="base"></div></div>
          <div class="phone"><div class="screen"><iframe src="${s.mobile || s.url}" title="${s.name} mobile" loading="lazy"></iframe></div></div>
        </div>
      </div>`;
    el.appendChild(sec);
  });
  // scale the 800px-wide stage down on narrow screens
  function fit() { document.querySelectorAll(".stage").forEach(st => { const s = Math.min(1, st.clientWidth / 800); st.style.setProperty("--s", s); st.querySelectorAll(".laptop,.phone").forEach(d => d.style.setProperty("--s", s)); }); }
  addEventListener("resize", fit); fit();
</script>
</body>
</html>
